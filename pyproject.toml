[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "predictive4d-joint"
version = "0.2.0"
description = "Neural joint camera/scene prediction and gated dynamic Gaussian SLAM research scaffold"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10", "Pillow>=10", "PyYAML>=6", "torch>=2.1", "tqdm>=4.66"]
[project.optional-dependencies]
test = ["pytest>=7"]
[project.scripts]
predictive4d = "predictive4d.cli:main"
[tool.setuptools.packages.find]
where=["src"]
