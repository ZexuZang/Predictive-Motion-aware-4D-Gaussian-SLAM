# Geometric + Gaussian primitive REFERENCE pipeline (no pretrained network required).
# Safe first run. Not equivalent to original Flow4DGS/GenFlow3D SOTA implementation.
motion_backend: history_velocity
pose_backend: constant_velocity
flow_variance: 0.04
max_points: 2000
sample_stride: 2
max_match_distance: 0.28
min_matches: 20
obs_std: 0.045
flow_std: 0.18
prior_sigma: 0.08
static_prior: 0.80
outer_iterations: 3
initial_gaussians: 220
append_gaussians: 90
max_static_gaussians: 900
max_dynamic_gaussians: 450
static_confidence_threshold: 0.55
dynamic_confidence_threshold: 0.30
snapshot_interval: 1
preview_interval: 1
render_width: 128
render_height: 96
# Extremely slow CPU finite-difference Gaussian photometric refinement; keep off initially
render_pose_refinement: false
render_refine_max_nfev: 8

# Research-only: dynamic Gaussian information feedback prototype (off for fair baseline)
dynamic_feedback_enabled: false
feedback_only_weak_static: false
depth_motion_threshold: 0.22
