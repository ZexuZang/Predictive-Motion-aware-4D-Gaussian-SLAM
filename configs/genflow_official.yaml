# Requires separate official GenFlow3D source, checkpoint and compiled PointNet2.
# Copy remaining tuning values from reference.yaml.
motion_backend: genflow_official
pose_backend: constant_velocity
# after separate supervised training:
# pose_backend: pose_gru
# pose_checkpoint: /content/pose_gru_train_only.pt
# pose_device: cuda
genflow_repo: /content/GenFlow3D
genflow_checkpoint: /content/GenFlow3D/pretrain/GenFlow3d_nuscenes.pth
genflow_device: cuda
genflow_npoint: 8192
genflow_length_pre: 3
flow_variance: 0.04
max_points: 8192
sample_stride: 2
max_match_distance: 0.30
min_matches: 30
obs_std: 0.045
flow_std: 0.18
prior_sigma: 0.08
static_prior: 0.80
outer_iterations: 3
initial_gaussians: 220
append_gaussians: 90
max_static_gaussians: 900
max_dynamic_gaussians: 450
static_confidence_threshold: 0.55
dynamic_confidence_threshold: 0.30
snapshot_interval: 1
preview_interval: 1
render_width: 128
render_height: 96
render_pose_refinement: false
render_refine_max_nfev: 8

# Research-only: dynamic Gaussian information feedback prototype (off for fair baseline)
dynamic_feedback_enabled: false
feedback_only_weak_static: false
depth_motion_threshold: 0.22
